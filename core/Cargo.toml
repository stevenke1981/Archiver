[package]
name = "archiver-core"
version = "0.4.0"
edition = "2024"

[dependencies]
bzip2 = "0.6.1"
chrono = "0.4.45"
flate2 = "1.1.10"
liblzma = { version = "0.4.8", features = ["static", "parallel"] }
sevenz-rust2 = { version = "0.23.0", features = ["compress", "aes256"] }
tar = "0.4.46"
thiserror = "2.0.21"
unrar = "0.5.8"
walkdir = "2.5.0"
zip = { version = "9.0.1", default-features = false, features = ["aes-crypto", "bzip2", "deflate-flate2-zlib-rs", "deflate64", "lzma", "ppmd", "xz", "zstd"] }
zstd = { version = "0.14.1", default-features = false, features = ["zstdmt"] }

[dev-dependencies]
crc32fast = "1.5.2"
tempfile = "3.27.0"
