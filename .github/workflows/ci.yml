name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-3-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgl1-mesa-dev libwayland-dev libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (release)
        run: cargo build --release --locked
      - name: Test
        run: cargo test --locked
      - name: Shell integration smoke test (register / unregister)
        shell: bash
        env:
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          B=target/release/archiver
          [ "$RUNNER_OS" = "Windows" ] && B=target/release/archiver.exe
          # simulate a v0.2.0 install, which --register-shell must clean up
          if [ "$RUNNER_OS" = "Windows" ]; then
            reg add 'HKCU\Software\Classes\Directory\shell\RustArchiver' /v MUIVerb /d 'Rust Archiver' /f
          else
            mkdir -p ~/.local/share/applications ~/.local/share/nautilus/scripts/"Rust Archiver" ~/Library/Services/"Rust Archiver - Extract here.workflow"
            touch ~/.local/share/applications/rust-archiver.desktop
          fi
          $B --register-shell
          if [ "$RUNNER_OS" = "Windows" ]; then
            ! reg query 'HKCU\Software\Classes\Directory\shell\RustArchiver' 2>/dev/null
          else
            test ! -e ~/.local/share/applications/rust-archiver.desktop
            test ! -e ~/.local/share/nautilus/scripts/"Rust Archiver"
            test ! -e ~/Library/Services/"Rust Archiver - Extract here.workflow"
          fi
          case "$RUNNER_OS" in
            Windows) reg query 'HKCU\Software\Classes\SystemFileAssociations\.zip\shell\Archiver\shell\02extracthere\command' /ve
                     reg query 'HKCU\Software\Classes\SystemFileAssociations\.zip\shell\Archiver\shell\05extractdest\command' /ve
                     reg query 'HKCU\Software\Classes\Directory\shell\Archiver' ;;
            macOS)   ls -R ~/Library/Services | grep "Archiver - "
                     plutil -lint ~/Library/Services/Archiver\ -\ *.workflow/Contents/Info.plist ~/Library/Services/Archiver\ -\ *.workflow/Contents/document.wflow ;;
            Linux)   cat ~/.local/share/applications/archiver.desktop
                     ls -la ~/.local/share/nautilus/scripts/"Archiver" ~/.local/share/nemo/actions ;;
          esac
          $B --unregister-shell
          if [ "$RUNNER_OS" = "Windows" ]; then ! reg query 'HKCU\Software\Classes\Directory\shell\Archiver' 2>/dev/null; fi
      - name: GUI screenshot (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/win-screenshot.ps1 -Exe target\release\archiver.exe
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && always()
        with:
          name: windows-gui-screenshot
          path: win-screenshot.png
      - name: Build Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-installer.ps1
      - name: Installer smoke test (silent install / verify / uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/installer-smoke.ps1
      - name: Show installer logs
        if: runner.os == 'Windows' && always()
        shell: pwsh
        run: if (Test-Path install.log) { Get-Content install.log -Tail 80 }
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: archiver-setup-windows-x64
          path: dist/archiver-setup-windows-x64.exe
      - name: Validate app Info.plist
        if: runner.os == 'macOS'
        run: plutil -lint scripts/Info.plist
