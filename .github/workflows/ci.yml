name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-3-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build (release)
        run: cargo build --release --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: rarc JSON smoke test
        shell: bash
        run: |
          R=target/release/rarc
          [ "$RUNNER_OS" = "Windows" ] && R=target/release/rarc.exe
          mkdir -p smoke/in && echo hello > smoke/in/a.txt
          $R c smoke/t.zip smoke/in --json | grep -q '"ok":true'
          $R l smoke/t.zip --json | grep -q '"name":"in/a.txt"'
          $R t smoke/t.zip --json | grep -q '"tested":1'
          $R comment set smoke/t.zip -m "ci comment"
          $R comment show smoke/t.zip | grep -q "ci comment"
          echo more > smoke/b.txt
          $R a smoke/t.zip smoke/b.txt --prefix in --json | grep -q '"ok":true'
          $R l smoke/t.zip --json | grep -q '"name":"in/b.txt"'
      - name: Shell integration smoke test (register / unregister)
        shell: bash
        env:
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          B=target/release/archiver
          [ "$RUNNER_OS" = "Windows" ] && B=target/release/archiver.exe
          # simulate a v0.2.0 install, which --register-shell must clean up
          if [ "$RUNNER_OS" = "Windows" ]; then
            reg add 'HKCU\Software\Classes\Directory\shell\RustArchiver' /v MUIVerb /d 'Rust Archiver' /f
          else
            mkdir -p ~/.local/share/applications ~/.local/share/nautilus/scripts/"Rust Archiver" ~/Library/Services/"Rust Archiver - Extract here.workflow"
            touch ~/.local/share/applications/rust-archiver.desktop
          fi
          $B --register-shell
          if [ "$RUNNER_OS" = "Windows" ]; then
            ! reg query 'HKCU\Software\Classes\Directory\shell\RustArchiver' 2>/dev/null
          else
            test ! -e ~/.local/share/applications/rust-archiver.desktop
            test ! -e ~/.local/share/nautilus/scripts/"Rust Archiver"
            test ! -e ~/Library/Services/"Rust Archiver - Extract here.workflow"
          fi
          case "$RUNNER_OS" in
            Windows) K='HKCU\Software\Classes\SystemFileAssociations\.zip\shell\Archiver'
                     reg query "$K\shell\02extracthere\command" /ve | grep -q -- '--collect --extract-here'
                     reg query "$K\shell\05extractdest\command" /ve
                     reg query "$K\shell\06test\command" /ve | grep -q -- '--collect --test'
                     reg query "$K\shell\07compresszip\command" /ve | grep -q -- '--compress-to zip'
                     reg query "$K\shell\08compress7z\command" /ve | grep -q -- '--compress-to 7z'
                     reg query "$K\shell\09extracteach\command" /ve
                     reg query "$K\shell\06test" /v MultiSelectModel | grep -q Player
                     reg query "$K\shell\06test" /v Icon
                     reg query 'HKCU\Software\Classes\Directory\shell\Archiver' /v MultiSelectModel | grep -q Player
                     reg query 'HKCU\Software\Classes\Directory\shell\Archiver\shell\07compresszip\command' /ve
                     # re-registering must not leave stale verbs behind
                     reg add "$K\shell\99stale" /ve /d x /f
                     $B --register-shell
                     ! reg query "$K\shell\99stale" 2>/dev/null ;;
            macOS)   ls -R ~/Library/Services | grep "Archiver - "
                     plutil -lint ~/Library/Services/Archiver\ -\ *.workflow/Contents/Info.plist ~/Library/Services/Archiver\ -\ *.workflow/Contents/document.wflow ;;
            Linux)   cat ~/.local/share/applications/archiver.desktop
                     ls -la ~/.local/share/nautilus/scripts/"Archiver" ~/.local/share/nemo/actions ;;
          esac
          $B --unregister-shell
          if [ "$RUNNER_OS" = "Windows" ]; then ! reg query 'HKCU\Software\Classes\Directory\shell\Archiver' 2>/dev/null; fi
      - name: GUI screenshot (headless, CPU rasteriser)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & target\release\archiver.exe --screenshot docs/screenshot.png --size 1100x720
          if ($LASTEXITCODE -ne 0) { throw "archiver --screenshot failed ($LASTEXITCODE)" }
          if ((Get-Item docs/screenshot.png).Length -lt 5000) { throw "screenshot looks blank" }
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && always()
        with:
          name: windows-gui-screenshot
          path: docs/screenshot.png
          if-no-files-found: ignore
      - name: Build Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-installer.ps1
      - name: Installer smoke test (silent install / verify / uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/installer-smoke.ps1
      - name: Show installer logs
        if: runner.os == 'Windows' && always()
        shell: pwsh
        run: if (Test-Path install.log) { Get-Content install.log -Tail 80 }
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: archiver-setup-windows-x64
          path: dist/archiver-setup-windows-x64.exe
      - name: Validate app Info.plist
        if: runner.os == 'macOS'
        run: plutil -lint scripts/Info.plist
