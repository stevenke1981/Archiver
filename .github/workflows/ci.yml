name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-3-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgl1-mesa-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (release)
        run: cargo build --release --locked
      - name: Test
        run: cargo test --locked
      - name: Shell integration smoke test (register / unregister)
        shell: bash
        env:
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          B=target/release/rust-archiver
          [ "$RUNNER_OS" = "Windows" ] && B=target/release/rust-archiver.exe
          $B --register-shell
          case "$RUNNER_OS" in
            Windows) reg query 'HKCU\Software\Classes\SystemFileAssociations\.zip\shell\RustArchiver\shell\02extracthere\command' /ve
                     reg query 'HKCU\Software\Classes\Directory\shell\RustArchiver' ;;
            macOS)   ls -R ~/Library/Services | grep -i "rust archiver"
                     plutil -lint ~/Library/Services/*Rust\ Archiver*.workflow/Contents/Info.plist ~/Library/Services/*Rust\ Archiver*.workflow/Contents/document.wflow ;;
            Linux)   cat ~/.local/share/applications/rust-archiver.desktop
                     ls -la ~/.local/share/nautilus/scripts/"Rust Archiver" ~/.local/share/nemo/actions ;;
          esac
          $B --unregister-shell
          if [ "$RUNNER_OS" = "Windows" ]; then ! reg query 'HKCU\Software\Classes\Directory\shell\RustArchiver' 2>/dev/null; fi
      - name: Validate app Info.plist
        if: runner.os == 'macOS'
        run: plutil -lint scripts/Info.plist
