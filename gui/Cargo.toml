[package]
name = "archiver"
version = "0.5.1"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
archiver-core = { path = "../core" }
rfd = { version = "0.17.2", default-features = false, features = ["gtk3"] }
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "software-renderer-systemfonts", "unstable-winit-030"] }
chrono = "0.4.45"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "archiver"
path = "src/main.rs"

[[bin]]
name = "rarc"
path = "src/bin/rarc.rs"

[build-dependencies]
slint-build = "1.18.1"
winresource = "0.1.34"
