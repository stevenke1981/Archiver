[package]
name = "rust-archiver"
version = "0.2.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
archiver-core = { path = "../core" }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = { version = "0.17.2", default-features = false, features = ["gtk3"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "rust-archiver"
path = "src/main.rs"

[[bin]]
name = "rarc"
path = "src/bin/rarc.rs"
